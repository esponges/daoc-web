<!doctype html>
<meta charset="utf-8">
<title>Stock UI check</title>
<style>
  html, body { margin: 0; background: #34452d; color: #ddd; font: 12px sans-serif; }
  #stage { position: relative; width: 1100px; height: 760px; }
  .tag { position: absolute; color: #fff; text-shadow: 0 0 3px #000; }
</style>
<div id="stage"></div>
<script type="module">
// Draws windows from the converted stock interface so they can be looked at.
//   run go run ./cmd/uiconv, then open /uidemo.html
import { loadUI, buildWindow, registerFonts, text } from './uiwin.js';

const stage = document.getElementById('stage');
const params = new URLSearchParams(location.search);
const data = await loadUI('data/ui/' + (params.get('skin') || 'atlantis') + '/');
if (!data) {
  stage.textContent = 'No converted interface: run go run ./cmd/uiconv';
} else {
  registerFonts(document, data);
  const show = (id, x, y, opts) => {
    try {
      const w = buildWindow(document, data, id, opts);
      w.el.style.left = x + 'px';
      w.el.style.top = y + 'px';
      stage.appendChild(w.el);
      // Fill every list box with sample rows, so the lists and scrollbars can be seen.
      for (const c of data.window(id).c || []) {
        if (c.t === 'TreeControlDef') {
          const t = w.tree((c.c.find((x) => x.t === 'ControlId') || {}).x);
          if (t) t.setGroups(['Bone Army', 'Darkness', 'Suppression'].map((title, g) => ({ title, open: g !== 1, rows: [1, 2, 3].map((k) => ({ text: 'Spell ' + g + '.' + k + '  ' + (k * 2) + ' pw', icon: 634 })) })));
          continue;
        }
        if (c.t !== 'ListBoxDef') continue;
        const l = w.list((c.c.find((x) => x.t === 'ControlId') || {}).x);
        if (l) l.setRows(Array.from({ length: 40 }, (_, i) => ({ text: (i % 10 === 0 ? 'Heading ' : 'Sample row ') + i, header: i % 10 === 0, icon: i % 10 ? 634 : 0 })));
      }
      const t = document.createElement('div');
      t.className = 'tag';
      t.style.left = x + 'px';
      t.style.top = (y - 14) + 'px';
      t.textContent = id;
      stage.appendChild(t);
      return w;
    } catch (e) {
      console.error(id, e);
    }
  };
  // ?w=Merchant,MiniPet,stats_spells draws just those windows (WindowId or Name) in a row.
  const only = params.get('w');
  if (only) {
    let x = 20, y = 40, rowH = 0;
    for (const id of only.split(',')) {
      const wt = data.window(id);
      if (!wt) { console.error('no window', id); continue; }
      const ww = parseFloat((wt.c.find((c) => c.t === 'Width') || {}).x) || 200, hh = parseFloat((wt.c.find((c) => c.t === 'Height') || {}).x) || 100;
      if (x + ww > 1080) { x = 20; y += rowH + 30; rowH = 0; }
      show(id, x, y);
      x += ww + 20;
      rowH = Math.max(rowH, hh);
    }
  } else {
  show('Chat', 20, 40, params.get('bg') ? { background: params.get('bg') } : {});
  show('MiniInfo', 400, 40);
  show('MiniGroup', 570, 40);
  show('Command', 720, 40);
  show('Compass', 900, 40);
  show('Clock', 900, 160);
  show('Concentration', 570, 190);
  show('Interact', 20, 300);

  // Text in each kind of font.
  const sample = (font, y) => {
    const t = text(document, data, font, 'Troll Warrior 123 — ' + font, 'rgb(255,255,255)');
    t.style.left = '420px';
    t.style.top = y + 'px';
    stage.appendChild(t);
  };
  [['arial9', 400], ['arial11', 420], ['arial14', 440], ['title', 464], ['button_large', 500], ['brit9s', 530], ['chat_small', 560], ['chat_large', 580]].forEach(([f, y]) => sample(f, y));
  }
}
</script>
